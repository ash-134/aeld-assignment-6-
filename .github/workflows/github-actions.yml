name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  verify-yocto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify Yocto Recipe and QEMU Configuration
        run: |
          test -f meta-aesd/recipes-aesd/aesd-assignments/aesd-assignments_git.bb
          grep "inherit update-rc.d" meta-aesd/recipes-aesd/aesd-assignments/aesd-assignments_git.bb
          grep "S99aesdsocket" meta-aesd/recipes-aesd/aesd-assignments/aesd-assignments_git.bb
          grep "9000" runqemu.sh
          echo "Assignment 6 Part 2 Yocto Recipe 驗證 100% 通過！"
